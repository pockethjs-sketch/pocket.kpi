function BalanceManagementView() {
  const { db, up, period, go, openLead } = useApp();
  const [filter, setFilter] = useState("high");
  const [query, setQuery] = useState("");
  const [dueMode, setDueMode] = useState("all");
  const [dueFrom, setDueFrom] = useState("");
  const [dueTo, setDueTo] = useState("");
  const [amountMin, setAmountMin] = useState("");
  const [amountMax, setAmountMax] = useState("");
  const [ownerFilter, setOwnerFilter] = useState("all");
  const [sortBy, setSortBy] = useState("risk");
  const r = pRange(period);
  const TYPES = [
    { id: "upsell", label: "추가 영업 잔여분", short: "추가 영업", desc: "자금유치 A+B 계약 중 B 재영업 등", tone: "amber", icon: TrendingUp },
    { id: "installment", label: "중·잔금 예정", short: "중·잔금", desc: "개발 선·중·잔 회차 중 아직 도래하지 않은 금액", tone: "indigo", icon: CalendarDays },
    { id: "overdue", label: "미수·악성채권", short: "미수금", desc: "예정일이 지났거나 회수 위험이 있는 금액", tone: "rose", icon: AlertCircle },
  ];
  const AMOUNT_BANDS = [
    { id: "high", label: "고액 잔금", range: "500만원 이상", min: 5000000, max: Infinity, tone: "rose" },
    { id: "mid", label: "중액 잔금", range: "200만~500만원 미만", min: 2000000, max: 5000000, tone: "amber" },
    { id: "low", label: "소액 잔금", range: "200만원 미만", min: 0, max: 2000000, tone: "slate" },
  ];
  /* 선택 월 계약은 전부 보여주고, 과거 계약은 미수 잔액이 남아 있는 동안 계속 관리 대상에 유지한다. */
  const contracts = db.leads.filter((l) => {
    const amount = l.contractAmount || paySum(l);
    return amount > 0 && (inR(l.contractAt, r) || actualPaid(l) < amount);
  });
  const rows = contracts.map((l) => {
    const amount = l.contractAmount || paySum(l);
    const paid = Math.min(amount, actualPaid(l));
    const remain = Math.max(0, amount - paid);
    const unpaid = payRows(l).filter((p) => !isPayDone(p) && (p.amount || 0) > 0);
    const overdue = unpaid.some((p) => p.dueAt && p.dueAt < todayISO());
    const scheduled = unpaid.some((p) => /중도금|잔금|회차/.test(p.label || ""));
    const autoType = overdue ? "overdue" : scheduled ? "installment" : "";
    const type = l.balanceType || autoType;
    const next = [...unpaid].filter((p) => p.dueAt).sort((a, b) => a.dueAt.localeCompare(b.dueAt))[0] || unpaid[0] || null;
    return { l, amount, paid, remain, unpaid, type, autoType, next };
  }).filter((x) => x.remain > 0);
  const contractAmount = contracts.reduce((s, l) => s + (l.contractAmount || paySum(l)), 0);
  const paidAmount = contracts.reduce((s, l) => s + Math.min(l.contractAmount || paySum(l), actualPaid(l)), 0);
  const remainAmount = rows.reduce((s, x) => s + x.remain, 0);
  const collectionRate = contractAmount ? Math.round(paidAmount / contractAmount * 100) : 0;
  const amountGroups = Object.fromEntries(AMOUNT_BANDS.map((band) => [band.id, rows.filter((x) => x.remain >= band.min && x.remain < band.max)]));
  const owners = [...new Set(rows.map((x) => x.l.salesOwner || "").filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
  const categoryRows = filter === "all" ? rows : (amountGroups[filter] || []);
  const minAmount = amountMin === "" ? null : num(amountMin);
  const maxAmount = amountMax === "" ? null : num(amountMax);
  const today = todayISO();
  const filtered = categoryRows.filter((x) => {
    const due = (x.next && x.next.dueAt) || "";
    const text = (x.l.company + " " + (x.l.salesOwner || "") + " " + (x.l.buildup || "")).toLowerCase();
    if (query.trim() && !text.includes(query.trim().toLowerCase())) return false;
    if (ownerFilter !== "all" && (ownerFilter === "unassigned" ? !!x.l.salesOwner : x.l.salesOwner !== ownerFilter)) return false;
    if (minAmount != null && x.remain < minAmount) return false;
    if (maxAmount != null && x.remain > maxAmount) return false;
    if (dueFrom && (!due || due < dueFrom)) return false;
    if (dueTo && (!due || due > dueTo)) return false;
    if (dueMode === "overdue" && (!due || due >= today)) return false;
    if (dueMode === "week" && (!due || due < today || due > addDaysISO(today, 7))) return false;
    if (dueMode === "month" && (!due || due < today || due > addDaysISO(today, 30))) return false;
    if (dueMode === "none" && due) return false;
    return true;
  }).sort((a, b) => {
    const ad = (a.next && a.next.dueAt) || "", bd = (b.next && b.next.dueAt) || "";
    if (sortBy === "remainDesc") return b.remain - a.remain || (ad || "9999").localeCompare(bd || "9999");
    if (sortBy === "remainAsc") return a.remain - b.remain || (ad || "9999").localeCompare(bd || "9999");
    if (sortBy === "dueAsc") return (ad || "9999-12-31").localeCompare(bd || "9999-12-31") || b.remain - a.remain;
    if (sortBy === "dueDesc") return (bd || "0000-01-01").localeCompare(ad || "0000-01-01") || b.remain - a.remain;
    if (sortBy === "contractDesc") return (b.l.contractAt || "").localeCompare(a.l.contractAt || "") || b.remain - a.remain;
    if (sortBy === "contractAsc") return (a.l.contractAt || "9999-12-31").localeCompare(b.l.contractAt || "9999-12-31") || b.remain - a.remain;
    if (sortBy === "company") return (a.l.company || "").localeCompare(b.l.company || "", "ko");
    const riskRank = (d) => d && d < today ? 0 : !d ? 1 : 2;
    return riskRank(ad) - riskRank(bd) || (ad || "9999-12-31").localeCompare(bd || "9999-12-31") || b.remain - a.remain;
  });
  const hasDetailFilter = !!(query || dueMode !== "all" || dueFrom || dueTo || amountMin || amountMax || ownerFilter !== "all" || sortBy !== "risk");
  const setType = (leadId, type) => up((d) => {

    if (lead) lead.balanceType = type;
  });
  const setCollectionDue = (row, dueAt) => up((d) => {

    if (!lead) return;
    lead.payments = lead.payments || [];
    let payment = row.next && lead.payments.find((p) => p.id === row.next.id);
    if (!payment) {
      payment = lead.payments.find((p) => !isPayDone(p) && (p.amount || 0) > 0);
    }
    if (!payment) {
      payment = { id: uid(), no: lead.payments.length + 1, label: "잔금", amount: row.remain, dueAt: "", paidAt: "", method: "", memo: "" };
      lead.payments.push(payment);
    }
    const before = payment.dueAt || "";
    payment.dueAt = dueAt;
    lead.history = lead.history || [];
    if (before !== dueAt) lead.history.push({ date: todayISO(), type: "결제 예정", note: (payment.label || payment.no + "회차") + " 회수 예정일 " + (dueAt ? fmtDate(dueAt) + " 지정" : "해제") });
  });
  const clearDetailFilters = () => {

      <div className="relative overflow-hidden rounded-3xl bg-slate-950 px-5 py-5 text-white shadow-xl shadow-slate-200/70">

function RevisionNotesView() {
  const { db, up, toast, users } = useApp();
  const [filter, setFilter] = useState("전체");
  const [draft, setDraft] = useState({ page: "", title: "", detail: "", priority: "보통", assignedTo: "" });
  const notes = db.revisionNotes || [];
  const ownerOptions = [{ value: "", label: "미배정" }, ...users.map((user) => ({ value: user.name, label: user.name }))];
  const statusRank = { "대기": 0, "진행중": 1, "완료": 2 };
  const priorityRank = { "긴급": 0, "높음": 1, "보통": 2, "낮음": 3 };
  const shown = [...notes]
    .filter((x) => filter === "전체" || x.status === filter)
    .sort((a, b) => (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9) || (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9) || (b.createdAt || "").localeCompare(a.createdAt || ""));
  const addNote = () => {
    if (!draft.title.trim() && !draft.detail.trim()) { toast("수정할 내용을 입력하세요"); return; }
    up((d) => {
      d.revisionNotes = d.revisionNotes || [];
      d.revisionNotes.unshift({
        id: uid(),
        page: draft.page.trim(),
        title: draft.title.trim() || draft.detail.trim().slice(0, 40),
        detail: draft.detail.trim(),
        priority: draft.priority,
        assignedTo: draft.assignedTo,
        status: "대기",
        createdAt: todayISO(),
        updatedAt: todayISO(),
      });
    });
    setDraft({ page: "", title: "", detail: "", priority: "보통", assignedTo: "" });
    toast("수정사항을 등록했습니다");
  };
  const changeNote = (id, key, value) => up((d) => {
    const note = (d.revisionNotes || []).find((x) => x.id === id);
    if (!note) return;
    note[key] = value;
    note.updatedAt = todayISO();
  });
  const count = (status) => status === "전체" ? notes.length : notes.filter((x) => x.status === status).length;
  return (
    <div className="space-y-4">
      <SecTitle icon={Pencil} title="수정사항" sub="고쳐야 할 화면과 내용을 기록합니다. 변경 내용은 Google Sheets 전체 DB 저장 대상에 포함됩니다." />
      <Card cls="p-4">
        <div className="grid md:grid-cols-[160px_minmax(150px,.65fr)_120px_140px] gap-2.5">
          <Fld label="화면 · 탭"><Inp value={draft.page} onChange={(e) => setDraft({ ...draft, page: e.target.value })} placeholder="예: 계약 총괄" /></Fld>
          <Fld label="수정 제목"><Inp value={draft.title} onChange={(e) => setDraft({ ...draft, title: e.target.value })} placeholder="무엇을 고쳐야 하는지 한 줄로" /></Fld>
          <Fld label="우선순위"><Sel className="w-full" value={draft.priority} onChange={(e) => setDraft({ ...draft, priority: e.target.value })} options={["긴급", "높음", "보통", "낮음"].map((x) => ({ value: x, label: x }))} /></Fld>
          <Fld label="담당자"><Sel className="w-full" value={draft.assignedTo} onChange={(e) => setDraft({ ...draft, assignedTo: e.target.value })} options={ownerOptions} /></Fld>
        </div>
        <div className="mt-2.5">
          <Fld label="상세 내용"><Ta rows={3} value={draft.detail} onChange={(e) => setDraft({ ...draft, detail: e.target.value })} placeholder="현재 문제, 원하는 결과, 참고할 기준을 적어주세요." /></Fld>
        </div>
        <div className="flex justify-end mt-2.5"><Btn kind="primary" onClick={addNote}><Plus size={12} />수정사항 등록</Btn></div>
      </Card>
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <Seg value={filter} onChange={setFilter} options={["전체", "대기", "진행중", "완료"].map((x) => [x, x + " " + count(x)])} />
        <span className="text-xs text-slate-400">미완료 {notes.filter((x) => x.status !== "완료").length}건</span>
      </div>
      <div className="space-y-2">
        {shown.map((note) => {
          const priorityCls = note.priority === "긴급" ? "bg-rose-100 text-rose-700 border-rose-200" : note.priority === "높음" ? "bg-amber-100 text-amber-700 border-amber-200" : note.priority === "낮음" ? "bg-slate-100 text-slate-500 border-slate-200" : "bg-indigo-50 text-indigo-600 border-indigo-200";
          return (
            <Card key={note.id} cls={"p-3 " + (note.status === "완료" ? "opacity-65" : "")}>
              <div className="grid lg:grid-cols-[115px_minmax(125px,.55fr)_minmax(240px,1.45fr)_100px_120px_105px_32px] gap-2 items-start">
                <Inp value={note.page || ""} onChange={(e) => changeNote(note.id, "page", e.target.value)} placeholder="화면명" className="text-xs" />
                <Inp value={note.title || ""} onChange={(e) => changeNote(note.id, "title", e.target.value)} placeholder="수정 제목" className="text-xs font-bold" />
                <Ta rows={2} value={note.detail || ""} onChange={(e) => changeNote(note.id, "detail", e.target.value)} placeholder="상세 내용" className="text-xs min-h-[38px]" />
                <Sel className={"w-full text-xs " + priorityCls} value={note.priority || "보통"} onChange={(e) => changeNote(note.id, "priority", e.target.value)} options={["긴급", "높음", "보통", "낮음"].map((x) => ({ value: x, label: x }))} />
                <Sel className="w-full text-xs" value={note.assignedTo || ""} onChange={(e) => changeNote(note.id, "assignedTo", e.target.value)} options={ownerOptions} />
                <Sel className="w-full text-xs" value={note.status || "대기"} onChange={(e) => changeNote(note.id, "status", e.target.value)} options={["대기", "진행중", "완료"].map((x) => ({ value: x, label: x }))} />
                <DangerBtn size="xs" onConfirm={() => up((d) => { d.revisionNotes = (d.revisionNotes || []).filter((x) => x.id !== note.id); })}><Trash2 size={11} /></DangerBtn>
              </div>
              <p className="text-[9px] text-slate-300 mt-1.5">등록 {note.createdAt || "-"} · 수정 {note.updatedAt || note.createdAt || "-"}</p>
            </Card>
          );
        })}
        {!shown.length && <Card><Empty text={filter === "전체" ? "등록된 수정사항이 없습니다." : filter + " 상태의 수정사항이 없습니다."} /></Card>}
      </div>
    </div>
  );
}

  const addUser = () => {
    const taken = new Set(accounts.map((account) => String(account.username || "").toUpperCase()));
    let no = 1;
    while (taken.has("USER" + no)) no += 1;
    const account = { id: uid(), username: "USER" + no, displayName: "새 사용자", role: "USER", active: true, passwordHash: USER_PASSWORD_HASH, allowedPages: ["performanceCheck"] };
    up((data) => { data.auth = data.auth || makeDefaultAuth(); data.auth.accounts.push(account); });
    setOpenId(account.id);
    toast("USER 계정을 추가했습니다 · 기본 비밀번호 pocketcompany");
  };
  const updateAccount = (id, patch) => up((data) => {
    const account = data.auth.accounts.find((item) => item.id === id);
    if (account) Object.assign(account, patch);
  });
  const togglePage = (accountId, pageId, checked) => up((data) => {
    const account = data.auth.accounts.find((item) => item.id === accountId);
    if (!account || account.role === "MASTER" || MASTER_ONLY_PAGES.includes(pageId)) return;
    const pages = new Set(account.allowedPages || []);
    if (checked) pages.add(pageId); else pages.delete(pageId);
    account.allowedPages = Array.from(pages);
  });
  const toggleGroup = (accountId, group, checked) => up((data) => {
    const account = data.auth.accounts.find((item) => item.id === accountId);
    if (!account || account.role === "MASTER") return;
    const pages = new Set(account.allowedPages || []);
    group.pages.filter((page) => !page.masterOnly).forEach((page) => checked ? pages.add(page.id) : pages.delete(page.id));
    account.allowedPages = Array.from(pages);
  });
  return (
    <div className="space-y-4">
      <SecTitle icon={Users} title="권한 관리" right={<Btn size="xs" kind="primary" onClick={addUser}><Plus size={12} />USER 추가</Btn>} />

              </div>
            </div>
          </header>
          <main className={"flex-1 w-full " + (view === "deals" ? "p-2 lg:p-4 max-w-none mx-0" : "p-4 lg:p-7 max-w-screen-2xl mx-auto")}>
            <Cur />
            <DataConnectionFooter view={effectiveView} db={db} saveState={saveState} />
          </main>
        </div>
      </div>
      <LeadModal />
      {toastMsg && <div className="fixed bottom-5 left-1/2 -translate-x-1/2" style={{ zIndex: 60 }}><div className="bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2" style={{ animation: "pcToast .18s ease-out" }}><Check size={13} className="text-emerald-400 shrink-0" />{toastMsg}</div></div>}
    </Ctx.Provider>
  );
}
