<script>
  /* CRM API는 file://의 null Origin을 거부합니다. 로컬 서버가 실행 중이면
     같은 파일을 허용된 localhost Origin으로 즉시 다시 엽니다. */
  if (location.protocol === 'file:') {
    fetch('http://127.0.0.1:8765/index.html', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { location.replace('http://127.0.0.1:8765/index.html'); })
      .catch(function () {});
  }
</script>

<script>
  /* ===== CRM 저장 연동 설정 =====
     구글시트 팀공유를 켜려면 아래 CRM_SHEET_URL 에 Apps Script 배포 URL(...exec)을 붙여넣으세요.
     비워두면 기존처럼 이 브라우저(localStorage)에만 저장됩니다.
     crm-apps-script.gs 의 TOKEN 과 아래 CRM_TOKEN 은 반드시 같아야 합니다. */
  var CRM_SHEET_URL = 'https://script.google.com/macros/s/AKfycbwscZiacAZFqxAsW0cA6X75OxTkkqLReVoHatUyePPV8ihsWad4GxzmnKaLphJo7sQ/exec';   // ← 구글시트 연동 ON (월별 광고비 포함)
  var CRM_TOKEN = 'pocket-crm-9f3k7x';           // ← crm-apps-script.gs 의 TOKEN 과 동일 (이미 맞춰둠)
  /* 사내 Nginx 배포에서는 같은 Origin의 서버 프록시를 사용합니다.
     개발자 서버가 다른 도메인이면 이 조건 또는 경로만 변경하면 됩니다. */
  var CRM_SERVER_PROXY_BASE = location.hostname === 'view.xn--9i1b674cwc38r6pa.com' ? '/kpi-api' : '';
  window.crmRemoteLoaded = false;
  window.crmRemoteError = '';
  window.crmRemoteApplied = false;
  window.crmRemoteRevision = '';
  window.crmRemoteHash = '';
  window.crmStorageVersion = 1;
  window.crmMutationVersion = 0;
  window.crmBackendVersion = '';
  window.crmMarketingError = '';
  window.crmLastRemoteValue = null;
  window.crmOptimisticRemoteValue = null;
  window.crmSaveQueue = Promise.resolve();
  window.crmPendingDbMutations = [];
  window.crmPendingRemoteSaves = 0;
  window.crmSyncInProgress = false;
  var CRM_LOCAL_STATE_KEY = 'pocketcrm:db:v4';
  var CRM_REMOTE_REVISION_KEY = 'crm:remoteRevision';
  var CRM_REMOTE_HASH_KEY = 'crm:remoteHash';
  var CRM_LOCAL_DIRTY_KEY = 'crm:localDirty';
  var CRM_PENDING_MUTATIONS_KEY = 'crm:pendingMutations:v1';
  try {
    var persistedPendingMutations = JSON.parse(localStorage.getItem(CRM_PENDING_MUTATIONS_KEY) || '[]');
    if (Array.isArray(persistedPendingMutations)) {
      window.crmPendingDbMutations = persistedPendingMutations.map(function (entry, index) {
        if (entry && entry.id && entry.mutation) return entry;
        return { id: 'legacy-' + Date.now().toString(36) + '-' + index, mutation: entry };
      }).filter(function (entry) { return entry.mutation && entry.mutation.changedCount; });
    }
  } catch (e) {}
  try {
    var cachedMarketingSpend = JSON.parse(localStorage.getItem('crm:marketingSpend') || 'null');
    if (cachedMarketingSpend && typeof cachedMarketingSpend === 'object') window.sheetMarketingSpend = cachedMarketingSpend;
    var cachedMarketingDaily = JSON.parse(localStorage.getItem('crm:marketingDaily') || 'null');
    if (cachedMarketingDaily && typeof cachedMarketingDaily === 'object') window.sheetMarketingDaily = cachedMarketingDaily;
    var cachedMarketingMeta = JSON.parse(localStorage.getItem('crm:marketingMeta') || 'null');
    if (cachedMarketingMeta && typeof cachedMarketingMeta === 'object') window.sheetMarketingMeta = cachedMarketingMeta;
  } catch (e) {}

  function crmDelay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function crmFetchSheetAction(action, timeoutMs, attempt) {
    attempt = Number(attempt || 0);
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timeout = controller ? setTimeout(function () { controller.abort(); }, timeoutMs) : null;
    var url = CRM_SHEET_URL + '?token=' + encodeURIComponent(CRM_TOKEN) + '&action=' + encodeURIComponent(action) + '&t=' + Date.now();
    return fetch(url, { cache: 'no-store', signal: controller ? controller.signal : undefined })
      .then(function (res) {
        if (!res.ok) throw new Error('sheet_' + res.status);
        return res.json();
      })
      .catch(function (error) {
        if (attempt >= 2 || (error && error.name === 'AbortError')) throw error;
        return crmDelay(attempt === 0 ? 500 : 1500).then(function () {
          return crmFetchSheetAction(action, timeoutMs, attempt + 1);
        });
      })
      .finally(function () { if (timeout) clearTimeout(timeout); });
  }

  function crmPostSheetAction(action, payload, timeoutMs) {
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timeout = controller ? setTimeout(function () { controller.abort(); }, timeoutMs || 30000) : null;
    return fetch(CRM_SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: CRM_TOKEN, action: action }, payload || {})),
      cache: 'no-store',
      signal: controller ? controller.signal : undefined
    }).then(function (res) {
      if (!res.ok) throw new Error('sheet_' + res.status);
      return res.json();
    }).then(function (body) {
      if (!body || body.error) throw new Error((body && body.error) || 'sheet_empty');
      return body;
    }).finally(function () { if (timeout) clearTimeout(timeout); });
  }

  window.crmFetchContractSheetChanges = async function () {
    if (!CRM_SHEET_URL) throw new Error('sheet_url_missing');
    var payload = await crmFetchSheetAction('contract_changes', 45000);
    if (!payload || payload.error) throw new Error((payload && payload.error) || 'contract_changes_empty');
    if (payload.action !== 'contract_changes' || !Array.isArray(payload.items)) throw new Error('contract_review_not_deployed');
    return payload;
  };

  window.crmSetContractSheetChangeStatus = async function (changeId, status, actor) {
    return crmPostSheetAction('contract_change_status', { changeId: changeId, status: status, actor: actor || 'web' }, 30000);
  };

  function crmApplyRemoteEnvelope(payload) {
    if (!payload || typeof payload !== 'object') return;
    window.crmRemoteRevision = String(payload.revision || window.crmRemoteRevision || '');
    window.crmRemoteHash = String(payload.hash || window.crmRemoteHash || '');
    window.crmStorageVersion = Number(payload.storageVersion || window.crmStorageVersion || 1);
    window.crmMutationVersion = Number(payload.mutationVersion || window.crmMutationVersion || 0);
    window.crmBackendVersion = String(payload.backendVersion || window.crmBackendVersion || '');
    try {
      if (window.crmRemoteRevision) localStorage.setItem(CRM_REMOTE_REVISION_KEY, window.crmRemoteRevision);
      if (window.crmRemoteHash) localStorage.setItem(CRM_REMOTE_HASH_KEY, window.crmRemoteHash);
    } catch (e) {}
  }

  function crmApplyMarketingEnvelope(payload) {
    if (!payload || typeof payload !== 'object') return;
    window.sheetMarketingSpend = payload.marketingSpend && typeof payload.marketingSpend === 'object' ? payload.marketingSpend : window.sheetMarketingSpend || null;
    window.sheetMarketingDaily = payload.marketingDaily && typeof payload.marketingDaily === 'object' ? payload.marketingDaily : window.sheetMarketingDaily || null;
    window.sheetMarketingMeta = payload.marketingMeta && typeof payload.marketingMeta === 'object' ? payload.marketingMeta : window.sheetMarketingMeta || null;
    try {
      if (window.sheetMarketingSpend) localStorage.setItem('crm:marketingSpend', JSON.stringify(window.sheetMarketingSpend));
      if (window.sheetMarketingDaily) localStorage.setItem('crm:marketingDaily', JSON.stringify(window.sheetMarketingDaily));
      if (window.sheetMarketingMeta) localStorage.setItem('crm:marketingMeta', JSON.stringify(window.sheetMarketingMeta));
    } catch (e) {}
  }

  window.fetchCrmSheetState = async function () {
    var localStateText = null;
    var cachedRevision = '';
    var localDirty = false;
    try {
      localStateText = localStorage.getItem(CRM_LOCAL_STATE_KEY);
      cachedRevision = localStorage.getItem(CRM_REMOTE_REVISION_KEY) || '';
      localDirty = localStorage.getItem(CRM_LOCAL_DIRTY_KEY) === '1';
    } catch (e) {}

    try {
      /* 1단계: 1.8MB 상태 대신 revision 메타만 조회합니다. 정상 서버는 수 KB 이내입니다. */
      var meta = await crmFetchSheetAction('meta', 25000);
      if (!meta || meta.error) throw new Error((meta && meta.error) || 'meta_empty');
      crmApplyRemoteEnvelope(meta);

      /* 구버전 서버가 action을 무시하고 전체 상태를 반환해도 두 번째 전체 요청은 하지 않습니다. */
      if (meta.data) {
        crmApplyMarketingEnvelope(meta);
        window.crmRemoteLoaded = true;
        window.crmRemoteError = '';
        window.crmLastRemoteValue = meta.data;
        window.crmOptimisticRemoteValue = meta.data;
        return { value: meta.data, revision: window.crmRemoteRevision, marketingSpend: window.sheetMarketingSpend, marketingDaily: window.sheetMarketingDaily, marketingMeta: window.sheetMarketingMeta, source: 'remote-legacy' };
      }

      var marketingPromise = crmFetchSheetAction('marketing', 20000)
        .then(function (marketing) {
          if (!marketing || marketing.error) throw new Error((marketing && marketing.error) || 'marketing_empty');
          crmApplyRemoteEnvelope(marketing);
          crmApplyMarketingEnvelope(marketing);
          window.crmMarketingError = '';
          return marketing;
        })
        .catch(function (error) {
          window.crmMarketingError = String(error && error.name === 'AbortError' ? 'marketing_timeout' : (error && error.message || error));
          return null;
        });

      var revisionUnchanged = !!(localStateText && cachedRevision && !localDirty && window.crmRemoteRevision && cachedRevision === window.crmRemoteRevision);
      if (revisionUnchanged) {
        await marketingPromise;
        window.crmRemoteLoaded = true;
        window.crmRemoteError = '';
        window.crmLastRemoteValue = localStateText;
        window.crmOptimisticRemoteValue = localStateText;
        return { unchanged: true, revision: window.crmRemoteRevision, marketingSpend: window.sheetMarketingSpend, marketingDaily: window.sheetMarketingDaily, marketingMeta: window.sheetMarketingMeta, source: 'remote-cache' };
      }

      /* 2단계: revision이 달라졌거나 로컬 변경이 남아 있을 때만 전체 상태를 한 번 읽습니다. */
      var results = await Promise.all([crmFetchSheetAction('state', 45000), marketingPromise]);
      var state = results[0];
      if (!state || state.error || !state.data) throw new Error((state && state.error) || 'state_empty');
      crmApplyRemoteEnvelope(state);
      window.crmRemoteLoaded = true;
      window.crmRemoteError = '';
      window.crmLastRemoteValue = state.data;
      window.crmOptimisticRemoteValue = state.data;
      return { value: state.data, revision: window.crmRemoteRevision, marketingSpend: window.sheetMarketingSpend, marketingDaily: window.sheetMarketingDaily, marketingMeta: window.sheetMarketingMeta, source: 'remote' };
    } catch (e) {
      window.crmRemoteLoaded = false;
      window.crmRemoteError = String(e && e.name === 'AbortError' ? 'backend_timeout' : (e && e.message || e) || 'sheet_unknown');
      return null;
    }
  };

  /* CRM 갱신은 사내 서버에서는 동일 Origin Nginx 프록시를 우선 사용하고,
     그 외 환경에서는 Apps Script 서버 프록시를 사용합니다. */
  window.crmFetchRefreshPayload = async function (startDay, endDay) {
    if (CRM_SERVER_PROXY_BASE) {
      var crmStart = String(startDay || '');
      var crmEnd = String(endDay || '');
      var leadParams = new URLSearchParams({
        keyword: '',
        start_dt: crmStart + 'T00:00:00+09:00',
        end_dt: crmEnd + 'T23:59:59+09:00',
        is_inquiry: 'true',
        t: String(Date.now())
      });
      var meetingParams = new URLSearchParams({
        offset: '0', limit: '1000', state: '1', page: 'schedule',
        start_dt: crmStart + 'T00:00:00+09:00',
        end_dt: crmEnd + 'T23:59:59+09:00',
        t: String(Date.now())
      });
      var serverResponses = await Promise.all([
        fetch(CRM_SERVER_PROXY_BASE + '/newarrivals?' + leadParams.toString(), { cache: 'no-store' }),
        fetch(CRM_SERVER_PROXY_BASE + '/mr-schedules?' + meetingParams.toString(), { cache: 'no-store' })
      ]);
      if (!serverResponses[0].ok) throw new Error('crm_server_leads_' + serverResponses[0].status);
      if (!serverResponses[1].ok) throw new Error('crm_server_meetings_' + serverResponses[1].status);
      var serverBodies = await Promise.all(serverResponses.map(function (response) { return response.json(); }));
      var leadRows = Array.isArray(serverBodies[0]) ? serverBodies[0] : (serverBodies[0].query || serverBodies[0].data || serverBodies[0].results || serverBodies[0].rows || []);
      var meetingRows = Array.isArray(serverBodies[1]) ? serverBodies[1] : (serverBodies[1].query || serverBodies[1].data || serverBodies[1].results || serverBodies[1].rows || []);
      leadRows = (leadRows || []).filter(function (row) {
        var day = String((row && row.reg_dt) || '').slice(0, 10);
        return day && day >= crmStart && day <= crmEnd;
      });
      meetingRows = (meetingRows || []).filter(function (row) {
        return Number(row && row.mr_type) === 1 && Number(row && row.mr_checked) === 1;
      });
      return { ok: true, start: crmStart, end: crmEnd, leads: leadRows, meetings: meetingRows, proxyVersion: 'nginx-same-origin-v1' };
    }
    if (!CRM_SHEET_URL) throw new Error('sheet_url_missing');
    var params = new URLSearchParams({
      token: CRM_TOKEN,
      action: 'crm_refresh',
      start: String(startDay || ''),
      end: String(endDay || ''),
      t: String(Date.now())

async function hashPassword(value) {
  const bytes = new TextEncoder().encode(String(value || ""));
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
}

function removeDemoLeadData(db) {
  if (!db || typeof db !== "object") return { changed: false, leads: 0, projects: 0 };
  db.leads = Array.isArray(db.leads) ? db.leads : [];
  db.projects = Array.isArray(db.projects) ? db.projects : [];
  const isImportedOrManual = (lead) => !!(
    lead && (lead.crmSheet || lead.crmMeeting || lead.calendarOnly || lead.manualEntry || lead.manualDeal || lead.legacyReceivablesSource)
  );
  const demoLeads = db.leads.filter((lead) => lead && DEMO_LEAD_COMPANIES.has(lead.company) && !isImportedOrManual(lead));
  if (!demoLeads.length) return { changed: false, leads: 0, projects: 0 };
  const demoLeadIds = new Set(demoLeads.map((lead) => lead.id).filter(Boolean));
  const beforeProjects = db.projects.length;
  db.leads = db.leads.filter((lead) => !demoLeads.includes(lead));
  db.projects = db.projects.filter((project) => !project || !demoLeadIds.has(project.leadId));
  return { changed: true, leads: demoLeads.length, projects: beforeProjects - db.projects.length };
}

    actualSubsAdded: added
  };
  db.imports[marker] = report;

}

function QualityBreakdownTip({ quality, leads, children }) {
  const [position, setPosition] = useState(null);
  const items = (leads || []).map((lead) => ({
    id: lead.id,
    company: lead.company || "업체명 없음",
    reason: tmQualityReason(lead)
  }));
  const placeTip = (el) => {
    if (!items.length || !el) return;
    const rect = el.getBoundingClientRect();
    const width = 352;
    const estimatedHeight = Math.min(334, 70 + Math.min(items.length, 8) * 43);
    const left = Math.max(12, Math.min(window.innerWidth - width - 12, rect.left + rect.width / 2 - width / 2));
    const below = rect.bottom + 8;
    const top = below + estimatedHeight <= window.innerHeight ? below : Math.max(12, rect.top - estimatedHeight - 8);
    setPosition({ left, top });
  };
  const show = (e) => placeTip(e.currentTarget);
  const title = quality === "드랍기업" ? "드랍기업" : quality === "미평가" ? "품질 미평가" : quality + " 품질";
  return (
    <div className="relative" tabIndex={items.length ? 0 : -1} onMouseEnter={show} onMouseLeave={() => setPosition(null)} onFocus={show} onBlur={() => setPosition(null)}>
      {children}
      {position && (
        <div role="tooltip" className="pointer-events-none fixed z-[9999] w-[352px] rounded-md border border-slate-700 bg-slate-950 p-3 text-left text-white shadow-2xl" style={{ left: position.left, top: position.top }}>
          <div className="flex items-center justify-between border-b border-white/10 pb-2">
            <strong className="text-xs font-black">{title} 기업 · 판정 근거</strong>
            <span className="text-[10px] font-bold text-slate-400">{items.length}건</span>
          </div>
          <div className="mt-1 max-h-[248px] overflow-hidden">
            {items.slice(0, 8).map((item) => (
              <div key={item.id} className="border-b border-white/10 py-2 last:border-b-0">
                <p className="truncate text-[11px] font-extrabold text-white">{item.company}</p>
                <p className="mt-0.5 line-clamp-2 text-[10px] font-medium leading-[1.45] text-slate-300">{item.reason}</p>
              </div>
            ))}
          </div>
          {items.length > 8 && <p className="mt-2 border-t border-white/10 pt-2 text-[10px] font-bold text-slate-400">외 {items.length - 8}개 기업</p>}
        </div>
      )}
    </div>
  );
}

function TmManagementView() {
  const { db, period, setDb, toast } = useApp();
  const [crmSyncBusy, setCrmSyncBusy] = useState(false);
  const [lastManualSync, setLastManualSync] = useState(() => {
    try { return Number(localStorage.getItem("crm:lastTmQualityManualSync")) || 0; } catch (e) { return 0; }
  });
  const r = pRange(period);
  const qualityFingerprint = (lead) => JSON.stringify({
    annualSales: lead && lead.crmSheet && lead.crmSheet.annualSales,
    detailCode: lead && lead.crmSheet && lead.crmSheet.detailCode,
    detailLabel: lead && lead.crmSheet && lead.crmSheet.detailLabel,
    mapped: lead && lead.crmQuality && lead.crmQuality.mapped,
    autoImported: lead && lead.score && lead.score.tm && lead.score.tm.autoImported,
    tmItems: lead && lead.score && lead.score.tm && lead.score.tm.items,
  });
  const refreshCrmQuality = async () => {
    if (crmSyncBusy) return;
    if (!window.crmFetchPremeeting) { toast("CRM 동기화 기능을 찾지 못했습니다"); return; }
    setCrmSyncBusy(true);
    try {
      const beforeQuality = Object.fromEntries((db.leads || []).map((lead) => [lead.id, qualityFingerprint(lead)]));
      const next = JSON.parse(JSON.stringify(db));
      const endDay = todayISO();
      const startDate = new Date(endDay + "T00:00:00+09:00");
      startDate.setDate(startDate.getDate() - 60);
      const startDay = startDate.getFullYear() + "-" + String(startDate.getMonth() + 1).padStart(2, "0") + "-" + String(startDate.getDate()).padStart(2, "0");
      let proxy = null;
      let proxyError = null;
      let syncSource = "CRM 직접 조회";
      try {
        proxy = await window.crmFetchRefreshPayload(startDay, endDay);
        syncSource = "Apps Script 경유";
      } catch (error) {
        proxyError = error;
        proxy = null;
      }
      if (!proxy && window.crmIsHosted && window.crmIsHosted()) throw proxyError || new Error("proxy_not_deployed");
      const leadRes = await window.crmFetchPremeeting(next, proxy ? proxy.leads : undefined);
      if (!leadRes || leadRes.err) {
        const message = leadRes && leadRes.err === "token" ? "CRM 인증 토큰이 만료되었습니다" : "CRM DB·품질 조회에 실패했습니다";
        toast(message); return;
      }

                          <div className="flex items-center justify-between gap-3"><b className="text-slate-700">{row.date || "날짜 없음"} · {row.service || "상품 미분류"}</b><b className="text-slate-900">{row.amount ? fmtWon(Number(row.amount)) : "금액 미확인"}</b></div>
                          <p className="text-slate-500 mt-0.5 break-words">{row.dealText || "계약 내용 없음"}</p>
                          {(row.paymentText || row.memo) && <p className="text-slate-400 mt-0.5 break-words">입금: {row.paymentText || "-"}{row.memo ? " · 메모: " + row.memo : ""}</p>}
                        </div>
                      ))}
                    </div>
                  </details>
                  <div className="flex justify-end gap-2 mt-3">
                    <Btn kind="danger" disabled={!!contractApplyingId} onClick={() => ignoreContractReviewItem(item)}>제외</Btn>
                    <Btn kind="primary" disabled={!!contractApplyingId} onClick={() => applyContractReviewItem(item)}>
                      {contractApplyingId === item.id ? <RefreshCw size={12} className="animate-spin" /> : <Plus size={12} />}신규업체 생성
                    </Btn>
                  </div>
                </div>
              );
            })}
            {contractReviewVisible.length === 0 && <Empty compact text="8월 이후 추가할 미등록 계약 업체가 없습니다." />}
          </div>
        </div>
      </Modal>
      <Modal open={contractLogOpen} onClose={() => setContractLogOpen(false)} wide title={"계약현황 활동 로그 · " + contractStatusLogs.length + "건"}>
        <div className="space-y-3">
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div className="relative w-full sm:w-[360px]">
              <Search size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
              <Inp value={contractLogQuery} onChange={(e) => setContractLogQuery(e.target.value)} placeholder="업체·작업·경로·입력자 검색" className="pl-8" />
            </div>
            <span className="text-[11px] text-slate-400">최근 기록부터 표시 · 삭제된 업체 로그도 보존</span>
          </div>
          <div className="overflow-x-auto border border-slate-200 bg-white">
            <div className="min-w-[980px]">
              <div className="grid grid-cols-[145px_180px_115px_130px_110px_minmax(260px,1fr)] gap-3 border-b border-slate-200 bg-slate-50 px-3 py-2 text-[10px] font-extrabold text-slate-400">
                <span>기록 시각</span><span>업체</span><span>작업</span><span>경로</span><span>입력자</span><span>상세</span>
              </div>
              <div className="max-h-[58vh] overflow-y-auto divide-y divide-slate-100">
                {contractLogVisible.map((log) => {
                  const canOpen = !!log.leadId && (db.leads || []).some((lead) => String(lead.id) === String(log.leadId));
                  const destructive = /삭제|제외|해제/.test(log.action || "");
                  const created = /추가|생성|완료/.test(log.action || "");
                  const synced = /동기화|갱신/.test(log.action || "");
                  const actionClass = destructive ? "bg-red-50 text-red-700 border-red-200" : created ? "bg-emerald-50 text-emerald-700 border-emerald-200" : synced ? "bg-sky-50 text-sky-700 border-sky-200" : "bg-slate-50 text-slate-600 border-slate-200";
                  return (
                    <div key={log.id} className="grid grid-cols-[145px_180px_115px_130px_110px_minmax(260px,1fr)] gap-3 items-start px-3 py-2.5 text-xs leading-5 hover:bg-slate-50/70">
                      <span className="tabular-nums text-slate-500 whitespace-nowrap">{formatContractLogTime(log.at)}</span>
                      <button type="button" disabled={!canOpen} onClick={() => { if (canOpen) { setContractLogOpen(false); openLead(log.leadId); } }} className={"text-left font-extrabold break-words " + (canOpen ? "text-slate-800 hover:text-indigo-600" : "text-slate-500 cursor-default")}>{log.company || "(업체명 미확인)"}</button>
                      <span><span className={"inline-flex border px-1.5 py-0.5 text-[10px] font-extrabold " + actionClass}>{log.action || "변경"}</span></span>
                      <span className="font-semibold text-slate-600 break-words">{log.source || "계약현황"}</span>
                      <span className="text-slate-600 break-words">{log.actor || "사용자"}</span>
                      <span className="text-slate-500 break-words">{log.detail || "상세 내용 없음"}</span>
                    </div>
                  );
                })}
                {contractLogVisible.length === 0 && <div className="px-4 py-12 text-center text-xs text-slate-400">{contractStatusLogs.length ? "검색 조건에 맞는 로그가 없습니다." : "아직 계약현황 활동 로그가 없습니다. 적용 이후 작업부터 기록됩니다."}</div>}
              </div>
            </div>
          </div>
          <p className="text-[11px] leading-5 text-slate-400">로그는 계약 데이터와 함께 Google Sheet에 저장됩니다. 과거 작업 시각은 근거 없이 역산하지 않으며, 이 기능 적용 이후 발생한 작업부터 기록합니다.</p>
        </div>
      </Modal>
      <PayModal id={payId} onClose={() => setPayId(null)} upPay={upPay} applyPreset={applyPreset} />
    </div>
  );
}

/* 결제 스케줄 모달 — 딜 1건의 회차별 금액 · 예정일 · 입금일 */
function PayModal({ id, onClose, upPay, applyPreset }) {
  const { db, toast } = useApp();
  const l = id ? db.leads.find((x) => x.id === id) : null;
  if (!l) return <Modal open={false} onClose={onClose} title="" />;
  const rows = payRows(l);
  const total = paySum(l);
  const got = payPaidSum(l);
  const amt = l.contractAmount || l.expected || 0;
  const diff = total - amt;
  const setTotalAmount = (value) => upPay(l.id, (x) => {
    const v = num(value);
    if (x.status === "계약 완료") x.contractAmount = v;
    else x.expected = v;
  });
  const setRow = (rid, k, v) => upPay(l.id, (x) => { const p = x.payments.find((y) => y.id === rid); if (p) p[k] = v; });
  const addRow = () => upPay(l.id, (x) => {
    const rest = Math.max(0, (x.contractAmount || x.expected || 0) - paySum(x));
    x.payments.push({ id: uid(), no: x.payments.length + 1, label: x.payments.length ? "잔금" : "일시금", amount: rest, dueAt: "", paidAt: "", method: "", memo: "" });
  });
  const delRow = (rid) => upPay(l.id, (x) => { x.payments = x.payments.filter((y) => y.id !== rid); });
  const togglePaid = (p) => upPay(l.id, (x) => {
    const t = x.payments.find((y) => y.id === p.id); if (!t) return;
    const wasDone = isPayDone(t);
    t.paidAt = wasDone ? "" : (t.dueAt && t.dueAt <= todayISO() ? t.dueAt : todayISO());
    t.paidConfirmed = false;
    x.history.push({ date: todayISO(), type: "결제", note: (!wasDone ? "입금 확인" : "입금 취소") + " · " + (t.label || t.no + "회차") + " " + fmtK(t.amount || 0) + "원" + (t.paidAt ? " (" + fmtDate(t.paidAt) + ")" : "") });
  });
  const fitAmount = () => upPay(l.id, (x) => { if (x.status === "계약 완료") x.contractAmount = paySum(x); else x.expected = paySum(x); toast("총 결제금액을 스케줄 합계로 맞췄습니다"); });
  return (
    <Modal open={!!id} onClose={onClose} wide title={"결제 금액 · 스케줄 — " + l.company}>
      <div className="space-y-3">
        <div className="rounded-xl border-2 border-indigo-200 bg-indigo-50 p-4">
          <div className="flex items-end gap-3 flex-wrap">
            <Fld label="총 결제받아야 할 금액">
              <div className="relative">
                <Inp value={amt || ""} onChange={(e) => setTotalAmount(e.target.value)} placeholder="예: 30000000" className="w-64 pr-9 text-right text-lg font-extrabold bg-white" />
                <span className="absolute right-3 top-2.5 text-sm font-bold text-slate-400">원</span>
              </div>
            </Fld>
            <div className="pb-1">
              <p className="text-xs text-indigo-700 font-bold">{amt > 0 ? fmtWon(amt) : "총 금액을 먼저 입력하세요"}</p>
              <p className="text-[11px] text-indigo-500 mt-0.5">이 금액을 기준으로 아래 회차를 분할합니다.</p>
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-xs font-bold text-slate-500">빠른 설정</span>
          {PAY_PRESETS.map((pre) => (
            <button key={pre.name} onClick={() => { applyPreset(l, pre); toast(pre.name + " 스케줄을 만들었습니다"); }} className="px-2.5 py-1 rounded-lg text-xs font-bold border bg-white text-slate-600 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition-colors">{pre.name}</button>
          ))}
          <span className="text-[11px] text-slate-400">계약금액 {fmtK(amt)}원 기준으로 회차를 자동 분배합니다</span>
        </div>
        <div className="overflow-x-auto rounded-xl border border-slate-100">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-xs text-slate-500">
              <tr>
                <th className="px-2 py-2 font-semibold w-10">회차</th>
                <th className="px-2 py-2 font-semibold w-28 text-left">구분</th>
                <th className="px-2 py-2 font-semibold w-32 text-right">금액</th>
                <th className="px-2 py-2 font-semibold w-36">결제 예정일</th>
                <th className="px-2 py-2 font-semibold w-44">입금 확인</th>
                <th className="px-2 py-2 font-semibold text-left">메모</th>
                <th className="px-2 py-2 w-8"></th>
              </tr>
            </thead>
            <tbody>
              {rows.map((p) => {
                const done = isPayDone(p);
                const od = !done && p.dueAt && p.dueAt < todayISO();
                const ratio = amt > 0 ? Math.round((p.amount || 0) / amt * 1000) / 10 : null;
                return (
                  <tr key={p.id} className={"border-b border-slate-50 " + (done ? "bg-emerald-50/40" : od ? "bg-red-50/40" : "")}>
                    <td className="px-2 py-2 text-center text-xs font-bold text-slate-400 tabular-nums">{p.no}</td>
                    <td className="px-2 py-2"><Sel value={p.label || "일시금"} onChange={(e) => setRow(p.id, "label", e.target.value)} options={PAY_LABELS} /></td>
                    <td className="px-2 py-2">
                      <Inp value={p.amount || 0} onChange={(e) => setRow(p.id, "amount", num(e.target.value))} className="w-28 text-right inline-block" />
                      {ratio != null && <p className="text-[10px] font-extrabold text-indigo-600 text-right mt-1">총액의 {ratio}%</p>}
                    </td>
                    <td className="px-2 py-2"><Inp type="date" value={p.dueAt || ""} onChange={(e) => setRow(p.id, "dueAt", e.target.value)} className={"w-32 " + (od ? "border-red-300 text-red-600" : "")} /></td>
                    <td className="px-2 py-2">
                      <div className="flex items-center gap-1.5">
                        <input type="checkbox" className="rounded w-4 h-4 accent-emerald-600" checked={done} onChange={() => togglePaid(p)} title="체크 = 입금 완료 (입금일 자동 입력)" />
                        {p.paidAt
                          ? <Inp type="date" value={p.paidAt} onChange={(e) => setRow(p.id, "paidAt", e.target.value)} className="w-32" />
                          : p.paidConfirmed
                            ? <span className="text-xs font-semibold text-emerald-700">지급완료 · 날짜 미상</span>
                            : <span className={"text-xs font-semibold " + (od ? "text-red-600" : "text-slate-400")}>{od ? "연체 " + Math.round((new Date(todayISO()) - new Date(p.dueAt)) / 86400000) + "일" : "미입금"}</span>}
                      </div>
                    </td>
                    <td className="px-2 py-2"><Inp value={p.memo || ""} placeholder="세금계산서 등" onChange={(e) => setRow(p.id, "memo", e.target.value)} className="w-full" /></td>
                    <td className="px-2 py-2 text-center"><button onClick={() => delRow(p.id)} title="이 회차 삭제" className="text-slate-300 hover:text-red-600">✕</button></td>
                  </tr>
                );
              })}
              {rows.length === 0 && <tr><td colSpan={7} className="px-3 py-6 text-center text-xs text-slate-400">회차가 없습니다 — 위 빠른 설정을 누르거나 아래 '회차 추가'로 만드세요.</td></tr>}
            </tbody>
            <tfoot>
              <tr className="bg-slate-50 text-xs">
                <td colSpan={2} className="px-2 py-2 font-bold text-slate-600">합계</td>
                <td className="px-2 py-2 text-right font-extrabold tabular-nums text-slate-800">{fmtWon(total)}</td>
                <td colSpan={4} className="px-2 py-2 text-slate-500">입금 <b className="text-emerald-600">{fmtK(got)}원</b> · 미수 <b className={total - got > 0 ? "text-red-600" : "text-slate-700"}>{fmtK(total - got)}원</b></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <Btn size="xs" onClick={addRow}><Plus size={11} />회차 추가</Btn>
          {diff !== 0 && rows.length > 0 && (
            <div className="flex items-center gap-2 text-xs font-bold text-amber-600">
              <AlertCircle size={13} />계약금액 {fmtK(amt)} · 스케줄 {fmtK(total)} ({diff > 0 ? "+" : ""}{fmtK(diff)})
              <Btn size="xs" onClick={fitAmount}>총 금액을 합계로 맞추기</Btn>
            </div>
          )}
        </div>
        <p className="text-xs text-slate-400">입금일이 찍힌 회차만 <b>수금(캐시인)</b>으로 잡힙니다. 예정일이 지난 미입금 회차는 <b className="text-red-500">연체</b>로 표시되고 오늘의 액션에 올라옵니다. 계약일(수주) 기준 매출은 그대로 유지됩니다.</p>
        <div className="flex justify-end"><Btn kind="primary" onClick={onClose}>닫기</Btn></div>
      </div>
    </Modal>
  );
}

/* ============================================================

function MarketingView() {
  const { db, up, period } = useApp();
  const r = pRange(period);
  const CLOSE = ["프리미팅 완료", "견적·제안 발송", "계약 완료"];
  const COLORS = ["#4f46e5", "#0ea5e9", "#10b981", "#f59e0b", "#8b5cf6", "#f43f5e", "#06b6d4", "#64748b", "#eab308", "#ec4899"];
  const sourceNames = [...new Set([...db.channels.map((c) => c.name), ...db.leads.map((l) => l.channel).filter(Boolean)])];
  const chNames = ["META", "NAVER", "GOOGLE", "지인+소개", "기타"];
  const setSpend = (name, v) => up((d) => {
    const defs = d.channels.filter((x) => channelGroupName(x.name) === name);
    let target = defs.find((x) => x.name === name) || defs[0];
    if (!target) { target = { id: uid(), name, status: "운영중", spendMonth: 0 }; d.channels.push(target); }
    defs.forEach((x) => { x.spendMonth = 0; });
    target.spendMonth = num(v);
  });
  const rows = chNames.map((ch, i) => {
    const chLeads = db.leads.filter((l) => channelGroupName(l.channel) === ch && inR(l.createdAt, r));
    const deals = chLeads.filter((l) => CLOSE.includes(l.status)).length;
    const wonL = chLeads.filter((l) => l.status === "계약 완료");
    const contract = wonL.length;
    const revenue = wonL.reduce((s, l) => s + (l.contractAmount || 0), 0);
    const spend = marketingSpendForPeriod(db, period, ch);
    const rawNames = sourceNames.filter((x) => channelGroupName(x) === ch);
    const leads = chLeads.length;
    /* DB 퀄리티 — 진단된 리드의 평균 점수로 CPA를 보정 (싼 DB가 진짜 싼지) */
    const sc = chLeads.map(leadScore).filter(Boolean);
    const avg = sc.length ? Math.round(sc.reduce((s, x) => s + x.total, 0) / sc.length) : null;
    const hi = sc.filter((x) => x.total >= 75).length;
    const cpa = spend != null && leads ? spend / leads : null;
    return { ch, rawNames, color: COLORS[i % COLORS.length], spend, leads, deals, contract, revenue, cpa, cac: spend != null && contract ? spend / contract : null, roas: spend ? revenue / spend : null,
      scN: sc.length, avg, hiPct: sc.length ? Math.round(hi / sc.length * 100) : null, qcpa: avg ? cpa / (avg / 100) : 0 };
  });
  const shownRows = rows;

  const [wNoteId, setWNoteId] = useState(null); const [wNote, setWNote] = useState("");

  const prog = (p) => Math.round((p.weeks.filter((w) => w.done).length / (p.weeks.length || 1)) * 100);
  const addProject = () => {
    if (!np.company) return;
    const tpl = db.procTpls[np.tpl]; const pid = uid();
    up((d) => d.projects.unshift({ id: pid, leadId: null, company: np.company, buildup: tpl.buildup, tpl: np.tpl, item: tpl.buildup, amount: np.amount, owner: np.owner, startDate: todayISO(), status: "진행중", sessions: tpl.buildup === "지원사업 관리" ? { total: 5, logs: [] } : null, weeks: tpl.weeks.map((w) => ({ ...w, id: uid(), done: false, meetings: [] })) }));
    setAddOpen(false); openProject(pid);
  };
  const toBiz = (p) => {
    if (db.bizSubs.some((s) => s.company === p.company && s.status !== "해지")) { toast("이미 포켓비즈 구독 중인 고객사입니다"); return; }

  };

      {tab === "tpl" ? <TplEditor /> : (
        <div className="grid lg:grid-cols-5 gap-4">
          <div className="lg:col-span-2 space-y-2">

              <button key={p.id} onClick={() => openProject(p.id)} className={"w-full text-left rounded-xl border p-3.5 bg-white transition-colors " + (projId === p.id ? "border-indigo-400 ring-1 ring-indigo-200" : "border-slate-200 hover:border-indigo-300")}>

function ProductsView() {

  const bStats = (name) => {
    const inP = db.leads.filter((l) => l.buildup === name && inR(l.contractAt || l.premeetingDoneAt || l.createdAt, r));
    const wonL = inP.filter((l) => l.status === "계약 완료");
    const newWon = wonL.filter((l) => (l.ctype || "신규") === "신규").length;
    const meetings = inP.filter((l) => (l.ctype || "신규") === "신규" && ["프리미팅 완료", "견적·제안 발송", "계약 완료"].includes(l.status)).length;
    const camount = wonL.reduce((s, l) => s + (l.contractAmount || 0), 0);
    return { deals: inP.length, ccount: newWon, meetings, camount, conv: meetings ? Math.round(newWon / meetings * 100) : 0 };
  };
  const total = db.products.reduce((a, p) => { const s = bStats(p.name); a.camount += s.camount; a.ccount += s.ccount; return a; }, { camount: 0, ccount: 0 });

      <div className="rounded-lg bg-indigo-50 border border-indigo-100 px-3 py-2 text-xs text-indigo-900 flex items-center gap-2 flex-wrap">

          const cc = st.conv >= 50 ? "#10b981" : st.conv >= 25 ? "#f59e0b" : "#ef4444";
          return (
            <Card key={p.id} cls="overflow-hidden">

   ============================================================ */
function IntegratedPerformanceView() {
  const { db, period, go, openLead, up, users, toast } = useApp();
  const [metricOpen, setMetricOpen] = useState(null);
  const [customerType, setCustomerType] = useState("전체");
  const [marketingLogDraft, setMarketingLogDraft] = useState({ kind: "action", date: todayISO(), channel: "", owner: "", action: "", note: "" });
  const r = pRange(period);
  const TARGET = { conv: 30, leadMonth: 500, preMonth: 150, contractMonth: 45, leadCost: 50000, preCost: 150000, contractCost: 450000 };
  const matchesCustomerType = (l) => customerType === "전체" || (l.ctype || "신규") === customerType;
  const cohort = db.leads.filter((l) => inR(l.createdAt, r) && matchesCustomerType(l));
  /* 계약현황에서 생성된 참석일을 기준으로 행당 1건 집계합니다.
     후속 상태가 드랍으로 바뀌어도 저장된 참석일은 과거 실적에 남습니다. */
  const pre = db.leads.filter((l) => inR(meetingDoneDate(l), r) && matchesCustomerType(l));
  const contract = db.leads.filter((l) => l.status === "계약 완료" && inR(l.contractAt, r) && matchesCustomerType(l));
  const contractAmountTotal = contract.reduce((sum, lead) => sum + (Number(lead.contractAmount) || paySum(lead) || 0), 0);
  const roasSpend = marketingSpendForPeriod(db, period);
  const spend = customerType === "기존" ? null : roasSpend;
  const contractRoas = roasSpend > 0 ? Math.round(contractAmountTotal / roasSpend * 100) : null;
  const targetFactor = period.mode === "month" ? 1 : period.mode === "year" ? 12 : period.mode === "day" ? 1 / 30 : null;
  const effectiveTargetFactor = customerType === "기존" ? null : targetFactor;
  const conversionTarget = customerType === "기존" ? null : TARGET.conv;
  const leadTarget = effectiveTargetFactor == null ? null : Math.ceil(TARGET.leadMonth * effectiveTargetFactor);
  const preTarget = effectiveTargetFactor == null ? null : Math.ceil(TARGET.preMonth * effectiveTargetFactor);
  const contractTarget = effectiveTargetFactor == null ? null : Math.ceil(TARGET.contractMonth * effectiveTargetFactor);
  const preRate = cohort.length ? pct(pre.length, cohort.length) : null;
  const contractRate = pre.length ? pct(contract.length, pre.length) : null;
  const leadCost = spend != null && cohort.length ? Math.round(spend / cohort.length) : null;
  const preCost = spend != null && pre.length ? Math.round(spend / pre.length) : null;
  const contractCost = spend != null && contract.length ? Math.round(spend / contract.length) : null;

function MarketingHubView() {
  const { db, period, go } = useApp();
  const r = pRange(period);
  const leads = db.leads.filter((l) => inR(l.createdAt, r));
  const met = leads.filter(hasCompletedMeeting);
  const periodMeetings = db.leads.filter((l) => inR(meetingDoneDate(l), r));
  const paid = leads.filter((l) => actualPaid(l) > 0);
  const revenue = paid.reduce((s, l) => s + actualPaid(l), 0);
  const spend = marketingSpendForPeriod(db, period);
  const hubChannelNames = [...new Set([...db.channels.map((c) => c.name), ...leads.map((l) => l.channel).filter(Boolean)].map(channelGroupName))];
  const hubRawRows = hubChannelNames.map((name) => {
    const rows = leads.filter((l) => channelGroupName(l.channel) === name);
    const meetings = rows.filter(hasCompletedMeeting);
    const paidCompanies = rows.filter((l) => actualPaid(l) > 0);
    const rev = rows.reduce((s, l) => s + actualPaid(l), 0);
    const chSpend = marketingSpendForPeriod(db, period, name);
    return {
      name, rows, meetings, paidCompanies, rev, spend: chSpend,
      cpl: chSpend != null && rows.length ? Math.round(chSpend / rows.length) : null,
      cac: chSpend != null && paidCompanies.length ? Math.round(chSpend / paidCompanies.length) : null,
      roas: chSpend ? Math.round(rev / chSpend * 100) : null,
    };
  }).filter((x) => x.rows.length || (x.spend || 0) > 0).sort((a, b) => b.rows.length - a.rows.length || b.rev - a.rev);
  const channelRows = hubRawRows;
  const totalCpl = spend != null && leads.length ? Math.round(spend / leads.length) : null;
  const totalCac = spend != null && paid.length ? Math.round(spend / paid.length) : null;
  const totalRoas = spend ? Math.round(revenue / spend * 100) : null;
  const monthKey = (y, m) => y + "-" + pad(m);
  const shiftMonthKey = (key, offset) => {
    const [y, m] = key.split("-").map(Number);
    const d = new Date(y, m - 1 + offset, 1);
    return monthKey(d.getFullYear(), d.getMonth() + 1);
  };
  const dataMonths = [...new Set([
    ...db.leads.map((l) => (l.createdAt || "").slice(0, 7)).filter(Boolean),
    ...db.leads.map((l) => meetingDoneDate(l).slice(0, 7)).filter(Boolean),
    ...Object.keys(db.adSpend || {}),
  ])].sort();
  const selectedMonth = period.mode === "all"
    ? (dataMonths[dataMonths.length - 1] || todayISO().slice(0, 7))
    : monthKey(period.y, period.m || 1);
  const trendMonths = period.mode === "year"
    ? Array.from({ length: (period.y === new Date().getFullYear() ? new Date().getMonth() + 1 : 12) }, (_, i) => monthKey(period.y, i + 1))
    : period.mode === "all"
      ? (dataMonths.length ? dataMonths.slice(-12) : [selectedMonth])
      : Array.from({ length: 6 }, (_, i) => shiftMonthKey(selectedMonth, i - 5));
  const trendData = trendMonths.map((month) => {
    const inflowRows = db.leads.filter((l) => (l.createdAt || "").startsWith(month));
    const meetingRows = inflowRows.filter(hasCompletedMeeting);
    const attributedRevenue = inflowRows.reduce((s, l) => s + actualPaid(l), 0);
    const rawMonthSpend = marketingSpendForMonth(db, month);
    const monthSpend = rawMonthSpend != null && rawMonthSpend > 50000 ? rawMonthSpend : null;
    return {
      month,
      label: Number(month.slice(5)) + "월",
      leads: inflowRows.length,
      meetings: meetingRows.length,
      meetingRate: inflowRows.length ? Math.round(meetingRows.length / inflowRows.length * 100) : 0,
      cpl: monthSpend > 0 && inflowRows.length ? Math.round(monthSpend / inflowRows.length) : null,
      roas: monthSpend > 0 ? Math.round(attributedRevenue / monthSpend * 100) : null,
      revenue: attributedRevenue,
      spend: monthSpend,
    };
  });
  const marketingKpi = (db.settings && db.settings.kpi) || {};
  const monthlyLeadGoal = marketingKpi.inflow || 500;
  const monthlyMeetingGoal = Math.round(monthlyLeadGoal * (marketingKpi.conv || 0.3));
  const monthlyRoasGoal = marketingKpi.roasTarget || 500;
  const trendMetrics = [
    { key: "leads", label: "유입 DB", suffix: "건", goal: monthlyLeadGoal, color: "#0ea5e9", soft: "bg-sky-50", text: "text-sky-700", desc: "해당 월에 유입된 DB" },
    { key: "meetings", label: "DB→프리 전환", suffix: "건", goal: monthlyMeetingGoal, color: "#6366f1", soft: "bg-indigo-50", text: "text-indigo-700", desc: "해당 월 유입 DB 중 이후 프리미팅을 완료한 기업" },
    { key: "roas", label: "ROAS", suffix: "%", goal: monthlyRoasGoal, color: "#f43f5e", soft: "bg-rose-50", text: "text-rose-700", desc: "유입월 귀속 매출 ÷ 광고비" },
  ];
  const MiniTrend = ({ metric }) => {
    const W = 360, H = 158, L = 18, R = 342, T = 24, B = 118;
    const values = trendData.map((x) => x[metric.key]);
    const usable = values.map((v) => v == null ? 0 : v);
    const maxV = Math.max(1, metric.goal || 0, ...usable);
    const xAt = (i) => trendData.length <= 1 ? (L + R) / 2 : L + (R - L) * i / (trendData.length - 1);
    const yAt = (v) => B - ((v || 0) / maxV) * (B - T);
    const path = usable.map((v, i) => (i ? "L" : "M") + xAt(i).toFixed(1) + "," + yAt(v).toFixed(1)).join(" ");
    const current = usable[usable.length - 1] || 0;
    const previous = usable.length > 1 ? usable[usable.length - 2] : null;
    const delta = previous == null || previous === 0 ? null : Math.round((current - previous) / previous * 100);
    const targetY = yAt(metric.goal);
    const achieved = current >= metric.goal;
    return (
      <div className="rounded-2xl border border-slate-100 bg-white p-3.5 shadow-sm">
        <div className="flex items-start justify-between gap-2">
          <div>
            <p className="text-[11px] font-bold text-slate-400">{metric.label}</p>
            <div className="flex items-baseline gap-1.5 mt-0.5">
              <strong className="text-2xl font-black text-slate-900 tabular-nums">{current.toLocaleString()}</strong>
              <span className="text-xs font-bold text-slate-400">{metric.suffix}</span>
              {delta != null && <span className={"text-[10px] font-extrabold " + (delta >= 0 ? "text-emerald-600" : "text-rose-600")}>{delta >= 0 ? "▲ " : "▼ "}{Math.abs(delta)}%</span>}
            </div>
          </div>
          <span className={"px-2 py-1 rounded-full text-[10px] font-extrabold " + (achieved ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700")}>
            목표 {metric.goal.toLocaleString()}{metric.suffix}
          </span>
        </div>
        <svg viewBox={"0 0 " + W + " " + H} className="w-full h-[158px] mt-1" role="img" aria-label={metric.label + " 월별 추이"}>
          {[0, 1, 2].map((n) => {
            const y = T + (B - T) * n / 2;
            return <line key={n} x1={L} y1={y} x2={R} y2={y} stroke="#e2e8f0" strokeWidth="1" strokeDasharray={n === 2 ? "0" : "4 5"} />;
          })}
          <line x1={L} y1={targetY} x2={R} y2={targetY} stroke={metric.color} strokeOpacity=".35" strokeWidth="1.5" strokeDasharray="6 5" />
          <text x={R} y={Math.max(10, targetY - 5)} textAnchor="end" fontSize="9" fontWeight="800" fill={metric.color}>목표선</text>
          {!!path && <path d={path} fill="none" stroke={metric.color} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />}
          {trendData.map((x, i) => (
            <g key={x.month}>
              <circle cx={xAt(i)} cy={yAt(usable[i])} r="4.5" fill="#fff" stroke={metric.color} strokeWidth="3">
                <title>{x.month + " · " + metric.label + " " + (values[i] == null ? "-" : values[i].toLocaleString() + metric.suffix)}</title>
              </circle>
              {(trendData.length <= 6 || i === trendData.length - 1 || i % 2 === 0) && <text x={xAt(i)} y={B + 19} textAnchor="middle" fontSize="9" fontWeight="700" fill="#64748b">{x.label}</text>}
              {(trendData.length <= 6 || i === trendData.length - 1) && <text x={xAt(i)} y={Math.max(12, yAt(usable[i]) - 9)} textAnchor="middle" fontSize="9" fontWeight="800" fill={metric.color}>{values[i] == null ? "-" : values[i].toLocaleString()}</text>}
            </g>
          ))}
        </svg>
        <p className="text-[10px] text-slate-400">{metric.desc}</p>
      </div>
    );
  };
  return (
    <div className="space-y-4">
      <SecTitle icon={Megaphone} title="마케팅 총괄" sub={pLabel(period) + " 유입 DB를 기준으로 채널 효율과 프리미팅·결제 전환을 한 화면에서 봅니다."}
        right={<div className="flex gap-2"><Btn size="xs" onClick={() => go("leads")}>유입 DB</Btn><Btn size="xs" kind="primary" onClick={() => go("marketing")}>채널 상세</Btn></div>} />
      <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
        <button className="text-left" onClick={() => go("leads")}><StatBig label="유입 DB" value={leads.length} unit="건" accent="border-sky-500" sub={totalCpl == null ? "아직 데이터가 없다" : "CPL " + fmtK(totalCpl) + "원"} /></button>
        <button className="text-left" onClick={() => go("premeetingHub")}><StatBig label="프리미팅" value={periodMeetings.length} unit="건" accent="border-indigo-500" sub={"선택 기간 실시 · 유입 코호트 전환 " + met.length + "건"} /></button>
        <StatBig label="결제 기업" value={paid.length} unit="개사" accent="border-emerald-500" sub={"유입 대비 " + pct(paid.length, leads.length) + "%"} />
        <StatBig label="ROAS" value={totalRoas == null ? "-" : totalRoas} unit={totalRoas == null ? "" : "%"} accent="border-rose-500" sub={spend == null ? "아직 데이터가 없다" : "귀속 매출 " + fmtK(revenue) + "원 · 광고비 " + fmtK(spend) + "원"} />
      </div>
      <div className="flex items-center gap-2 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3 py-2 text-[10px] text-indigo-700">
        <Info size={12} className="shrink-0" />
        <span><b>DB→프리 전환 {met.length}건</b>은 선택 기간 유입 DB의 후속 전환이고, <b>기간 실시 {periodMeetings.length}건</b>은 선택 기간에 실제 진행된 프리미팅입니다.</span>
      </div>
      <Card>
        <div className="flex items-start justify-between gap-3 px-4 pt-4 pb-3 flex-wrap">
          <div>
            <p className="text-sm font-extrabold text-slate-900">마케팅 성과 추이</p>
            <p className="text-[10px] text-slate-400 mt-1">서로 다른 단위를 겹치지 않고 월별 유입 코호트 기준으로 분리했습니다. 최신 월은 아직 전환·입금이 덜 반영될 수 있습니다.</p>
          </div>
          <span className="px-2.5 py-1 rounded-full bg-slate-100 text-[10px] font-bold text-slate-500">월별 · 유입월 귀속</span>

        <div className="grid lg:grid-cols-3 gap-3 px-3 pb-3">
          {trendMetrics.map((metric) => <MiniTrend key={metric.key} metric={metric} />)}
        </div>
        <div className="overflow-x-auto border-t border-slate-100">
          <table className="w-full min-w-[760px] text-xs">
            <thead><tr className="bg-slate-50 text-[10px] text-slate-400">
              <th className="px-4 py-2 text-left">유입월</th><th className="px-3 py-2 text-right">유입 DB</th><th className="px-3 py-2 text-right">프리 전환</th><th className="px-3 py-2 text-right">DB→프리</th><th className="px-3 py-2 text-right">CPL</th><th className="px-4 py-2 text-right">ROAS</th>
            </tr></thead>
            <tbody>
              {[...trendData].reverse().slice(0, 6).map((x, i) => (
                <tr key={x.month} className={"border-t border-slate-100 " + (i === 0 ? "bg-indigo-50/35" : "")}>
                  <td className="px-4 py-2.5 font-bold text-slate-700">{x.month}{i === 0 && <span className="ml-2 text-[9px] text-indigo-600">최신</span>}</td>
                  <td className={"px-3 py-2.5 text-right font-extrabold tabular-nums " + (x.leads >= monthlyLeadGoal ? "text-emerald-700" : "text-rose-600")}>{x.leads.toLocaleString()}건</td>
                  <td className={"px-3 py-2.5 text-right font-extrabold tabular-nums " + (x.meetings >= monthlyMeetingGoal ? "text-emerald-700" : "text-rose-600")}>{x.meetings.toLocaleString()}건</td>
                  <td className={"px-3 py-2.5 text-right font-bold tabular-nums " + (x.meetingRate >= Math.round((marketingKpi.conv || 0.3) * 100) ? "text-emerald-700" : "text-rose-600")}>{x.meetingRate}%</td>
                  <td className={"px-3 py-2.5 text-right font-bold tabular-nums " + (x.cpl != null && x.cpl <= 50000 ? "text-emerald-700" : "text-rose-600")}>{x.cpl == null ? "-" : fmtK(x.cpl) + "원"}</td>
                  <td className={"px-4 py-2.5 text-right font-extrabold tabular-nums " + (x.roas != null && x.roas >= monthlyRoasGoal ? "text-emerald-700" : "text-rose-600")}>{x.roas == null ? "-" : x.roas.toLocaleString() + "%"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
      <Card>
        <div className="flex items-center justify-between gap-2 px-4 pt-4 pb-3 flex-wrap">
          <div>
            <p className="text-sm font-extrabold text-slate-900">성과 흐름</p>
            <p className="text-[10px] text-slate-400 mt-1">광고비 → 유입 DB → 프리미팅 → 결제 → 귀속 매출 흐름을 채널별로 비교합니다.</p>
          </div>
          <Btn size="xs" kind="ghost" onClick={() => go("marketing")}>전체 분석 <ExternalLink size={11} /></Btn>

        <div className="overflow-x-auto">
          <table className="w-full min-w-[1080px] text-sm">

              <tr className="border-y border-slate-100 bg-slate-50 text-[10px] text-slate-400">

                  <td className="px-3 py-3 text-right text-xs font-bold text-indigo-600 tabular-nums">{pct(x.meetings.length, x.rows.length)}%</td>
                  <td className="px-3 py-3 text-right font-black text-emerald-700 tabular-nums">{x.paidCompanies.length}</td>

                  <td className="px-3 py-3 text-right text-xs font-bold text-slate-600 tabular-nums">{x.cac == null ? "-" : fmtK(x.cac) + "원"}</td>
                  <td className="px-3 py-3 text-right font-black text-teal-700 tabular-nums">{fmtK(x.rev)}원</td>
                  <td className={"px-4 py-3 text-right font-black tabular-nums " + (x.roas != null && x.roas >= 100 ? "text-emerald-700" : x.roas == null ? "text-slate-300" : "text-rose-600")}>{x.roas == null ? "-" : x.roas + "%"}</td>
                </tr>
              ))}
              {!channelRows.length && <tr><td colSpan={11}><Empty text="해당 기간의 마케팅 데이터가 없습니다." /></td></tr>}
            </tbody>
            {!!channelRows.length && (

  const CONTRACT_BUILDUPS = [
    { id: "지원사업", label: "지원사업", tone: "border-sky-300 bg-sky-50 text-sky-800", amountTone: "text-sky-700" },

  const contractBuildupOf = (l) => {
    const classify = (text) => {
      if (text.includes("지원사업") || text.includes("정부지원")) return "지원사업";
      if (text.includes("투자유치") || text.includes("자금유치") || text.includes("투자")) return "투자유치";
      if (text.includes("브랜딩") || text.includes("브랜드")) return "브랜딩";
      if (text.includes("AX") || text.includes("개발") || text.includes("MVP")) return "개발";
      return "";

    return classify(String(l.buildup || "")) || classify([...(l.buildups || []), ...((l.lineItems || []).map((x) => x.buildup || x.name))].filter(Boolean).join(" "));
  };

    const rows = contractedSorted.filter((l) => contractBuildupOf(l) === item.id && actualPaid(l) > 0);

        right={<Btn size="xs" kind="primary" onClick={() => go("deals")}>프리미팅 상세</Btn>} />
      <div className="grid sm:grid-cols-2 gap-3">
        <button className="text-left" onClick={() => go("deals")}><StatBig label="진행한 프리미팅" value={done.length} unit="건" accent="border-indigo-500" sub="CRM 캘린더 + 계약현황 기준 · 클릭=상세" /></button>
        <button className="text-left" onClick={() => setContractListScope("전체")}><StatBig label="계약 수" value={contracted.length} unit="건" accent="border-emerald-500" sub="계약일 기준 · 클릭=전체 목록" /></button>
      </div>
      <Card cls="p-4">
        <div className="flex items-center justify-between gap-2 mb-3">
          <div>
            <p className="text-sm font-extrabold text-slate-900">빌드업별 결제 성과</p>

  const contracts = db.leads.filter((l) => l.status === "계약 완료" && inR(l.contractAt, r) && contractValue(l) > 0);
  const recentContracts = [...contracts].sort((a, b) => (b.contractAt || "").localeCompare(a.contractAt || ""));
  const visibleRecentContracts = recentContracts.slice(0, recentContractLimit);
  useEffect(() => setRecentContractLimit(10), [period.mode, period.year, period.month, period.date]);
  const meetings = db.leads.filter((l) => inR(meetingDoneDate(l), r));
  const convertedMeetings = meetings.filter((l) => l.status === "계약 완료" && contractValue(l) > 0);
  const contractAmount = contracts.reduce((s, l) => s + contractValue(l), 0);
  const revenueRows = db.leads.flatMap((l) => payRows(l).filter((p) => p.paidAt && inR(p.paidAt, r) && (p.amount || 0) > 0).map((p) => ({ l, p })));
  const revenue = revenueRows.reduce((s, x) => s + (x.p.amount || 0), 0);
  const outstandingRows = contracts.map((l) => ({ l, amount: Math.max(0, contractValue(l) - actualPaid(l)), date: l.contractAt })).filter((x) => x.amount > 0);
  const outstanding = outstandingRows.reduce((s, x) => s + x.amount, 0);
  const paidCompanyMap = {};
  revenueRows.forEach(({ l, p }) => {
    const current = paidCompanyMap[l.id] || { l, amount: 0, date: "" };
    current.amount += p.amount || 0;
    if ((p.paidAt || "") > current.date) current.date = p.paidAt || "";
    paidCompanyMap[l.id] = current;
  });
  const paidCompanies = Object.values(paidCompanyMap).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const contractCompanies = [...contracts].sort((a, b) => (b.contractAt || "").localeCompare(a.contractAt || "")).map((l) => ({ l, amount: contractValue(l), date: l.contractAt }));
  const contractBuildupKey = (l) => {
    const raw = [l.buildup, ...(l.buildups || []), ...((l.lineItems || []).map((x) => x.buildup || x.name))].filter(Boolean).join(" ");
    if (raw.includes("지원사업") || raw.includes("정부지원")) return "지원사업 관리";
    if (raw.includes("투자유치") || raw.includes("자금유치")) return "투자유치";
    if (raw.includes("브랜딩") || raw.includes("브랜드")) return "브랜딩 관리";

    return String(l.buildup || (l.buildups || [])[0] || "미지정").trim() || "미지정";
  };
  const extraBuildups = [...new Set([...contracts.map(contractBuildupKey), ...paidCompanies.map((x) => contractBuildupKey(x.l))])]
    .filter((key) => !BUILDUPS.includes(key))

  const contractBuildupKeys = [...BUILDUPS, ...extraBuildups];
  const buildupStats = contractBuildupKeys.map((key) => {
    const contractRows = contracts.filter((l) => contractBuildupKey(l) === key);
    const paidRowsForPeriod = paidCompanies.filter((x) => contractBuildupKey(x.l) === key);
    const contractAmountForKey = contractRows.reduce((sum, l) => sum + contractValue(l), 0);
    const cohortPaid = contractRows.reduce((sum, l) => sum + actualPaid(l), 0);
    const periodPaid = paidRowsForPeriod.reduce((sum, x) => sum + x.amount, 0);
    const outstandingForKey = contractRows.reduce((sum, l) => sum + Math.max(0, contractValue(l) - actualPaid(l)), 0);
    const companyMap = {};
    contractRows.forEach((l) => {
      companyMap[l.id] = { l, inContractPeriod: true, contractAmount: contractValue(l), cohortPaid: actualPaid(l), periodPaid: 0, outstanding: Math.max(0, contractValue(l) - actualPaid(l)) };
    });
    paidRowsForPeriod.forEach((x) => {
      const row = companyMap[x.l.id] || { l: x.l, inContractPeriod: false, contractAmount: contractValue(x.l), cohortPaid: actualPaid(x.l), periodPaid: 0, outstanding: Math.max(0, contractValue(x.l) - actualPaid(x.l)) };
      row.periodPaid += x.amount;
      companyMap[x.l.id] = row;
    });
    return {

      count: contractRows.length,
      contractAmount: contractAmountForKey,

      periodPaid,
      outstanding: outstandingForKey,

                <span>기준일</span><span>기업</span><span>빌드업</span><span>담당자</span><span className="text-right">{selectedMetric.amountLabel}</span>

function SupportContractView() {
  const { up, toast } = useApp();
  const [viewMode, setViewMode] = useState("board");
  const [frameRevision, setFrameRevision] = useState(0);
  const [frameLoaded, setFrameLoaded] = useState(false);
  const [listLoading, setListLoading] = useState(false);
  const grantBoardUrl = "https://lahae-kang.github.io/pocket-startup-grant/";
  const reloadGrantBoard = () => { setFrameLoaded(false); setFrameRevision((value) => value + 1); };
  const refreshSupportList = async () => {
    if (listLoading || !window.fetchSupportBoard) return;
    setListLoading(true);
    try {
      const result = await window.fetchSupportBoard();
      if (!result) throw new Error("empty_support_board");
      up((draft) => { draft.supportBoard = { ...result, syncedAt: new Date().toISOString() }; });
      toast("Supabase 지원사업 원본을 최신화했습니다");
    } catch (error) {
      toast("지원사업 원본 최신화에 실패했습니다");
    } finally {
      setListLoading(false);
    }
  };
  const changeViewMode = (mode) => {
    setViewMode(mode);
    if (mode === "list") refreshSupportList();
    else reloadGrantBoard();
  };
  const refreshCurrentView = () => viewMode === "board" ? reloadGrantBoard() : refreshSupportList();
  const connected = viewMode === "board" ? frameLoaded : !listLoading;
  return (
    <div className="space-y-3">
      <SecTitle icon={Check} title="지원사업 관리" right={<div className="flex items-center gap-2">
        <div className="inline-flex rounded-md border border-slate-200 bg-white p-0.5">
          {[["board", "보드 보기"], ["list", "리스트 보기"]].map(([value, label]) => <button key={value} type="button" onClick={() => changeViewMode(value)} className={"h-6 rounded px-2.5 text-[10px] font-extrabold transition-colors " + (viewMode === value ? "bg-slate-900 text-white" : "text-slate-500 hover:bg-slate-100")}>{label}</button>)}
        </div>
        <span className={"inline-flex items-center gap-1.5 rounded-md border px-2 py-1 text-[10px] font-extrabold " + (connected ? "border-emerald-200 bg-emerald-50 text-emerald-700" : "border-amber-200 bg-amber-50 text-amber-700")}><span className={"h-1.5 w-1.5 rounded-full " + (connected ? "bg-emerald-500" : "bg-amber-500")} />{connected ? "Supabase 원본 연결" : "원본 불러오는 중"}</span>
        <Btn size="xs" onClick={refreshCurrentView} disabled={listLoading}><RefreshCw size={12} className={listLoading ? "animate-spin" : ""} />최신화</Btn>
        <a href={grantBoardUrl} target="_blank" rel="noreferrer" className="inline-flex h-7 items-center gap-1 rounded-md border border-slate-200 bg-white px-2.5 text-[10px] font-extrabold text-slate-600 hover:border-slate-400"><ExternalLink size={11} />원본 열기</a>
      </div>} />
      {viewMode === "board" ? <div className="relative w-full overflow-hidden rounded-md border border-slate-200 bg-white shadow-sm" style={{ height: "calc(100vh - 148px)", minHeight: "640px" }}>
        {!frameLoaded && <div className="absolute inset-0 z-10 flex items-center justify-center bg-white"><div className="flex items-center gap-2 text-xs font-extrabold text-slate-500"><RefreshCw size={14} className="animate-spin text-indigo-500" />지원사업 원본을 불러오는 중입니다.</div></div>}
        <iframe
          key={frameRevision}
          title="포켓컴퍼니 지원사업 관리 원본"
          src={grantBoardUrl + "?embedded=crm&refresh=" + frameRevision}
          className="block h-full w-full border-0 bg-white"
          loading="eager"
          allow="clipboard-read; clipboard-write"
          onLoad={() => setFrameLoaded(true)}
        />
      </div> : <SupportGrantListView loading={listLoading} />}
    </div>
  );
}

function SupportGrantListView({ loading }) {
  const { db } = useApp();
  const [tab, setTab] = useState("assignments");
  const [query, setQuery] = useState("");
  const [scope, setScope] = useState("all");
  const [statusFilter, setStatusFilter] = useState("all");
  const [selected, setSelected] = useState(null);
  const board = db.supportBoard || {};
  const companies = Array.isArray(board.companies) ? board.companies : [];
  const grants = Array.isArray(board.grants) ? board.grants : [];
  const schedules = Array.isArray(board.schedules) ? board.schedules : [];
  const logs = Array.isArray(board.logs) ? board.logs : [];
  const companyOrder = new Map((Array.isArray(board.companyOrder) ? board.companyOrder : []).map((id, index) => [String(id), index]));
  const companyById = new Map(companies.map((company) => [String(company.id), company]));
  const grantById = new Map(grants.map((grant) => [String(grant.id), grant]));
  const statusLabel = (value) => ({
    done: "완료", active: "진행", progress: "진행", pending: "대기",
    rejected: "탈락", passed: "합격", success: "합격", ready: "준비"
  }[String(value || "").toLowerCase()] || value || "미입력");
  const statusTone = (value) => {
    const label = statusLabel(value);
    if (label === "완료" || label === "합격") return "border-emerald-200 bg-emerald-50 text-emerald-700";
    if (label === "진행") return "border-indigo-200 bg-indigo-50 text-indigo-700";
    if (label === "탈락") return "border-rose-200 bg-rose-50 text-rose-700";
    if (label === "대기" || label === "준비") return "border-amber-200 bg-amber-50 text-amber-700";
    return "border-slate-200 bg-slate-50 text-slate-500";
  };
  const dateText = (value) => value ? String(value).slice(0, 10) : "-";
  const budgetText = (value) => {
    if (value === null || value === undefined || value === "") return "미입력";
    if (typeof value === "number") return value.toLocaleString("ko-KR") + "원";
    const source = String(value).trim();
    if (/^[\d,]+$/.test(source)) return Number(source.replace(/,/g, "")).toLocaleString("ko-KR") + "원";
    return source;
  };
  const assignedGrantIds = new Set();
  const assignmentRows = [];
  companies.forEach((company) => {
    const ids = Array.isArray(company.assignedGrantIds) ? company.assignedGrantIds : (company.assignedGrantIds ? [company.assignedGrantIds] : []);
    if (!ids.length) assignmentRows.push({ id: "company-" + company.id, company, grant: null, status: "", source: "", result: "", schedules: [], assigned: false });
    ids.forEach((grantId, index) => {
      const key = String(grantId);
      assignedGrantIds.add(key);
      const rowSchedules = schedules.filter((item) => String(item.companyId) === String(company.id) && String(item.grantId) === key);
      assignmentRows.push({
        id: "assignment-" + company.id + "-" + key + "-" + index,
        company,
        grant: grantById.get(key) || { id: grantId, title: "삭제되었거나 찾을 수 없는 지원사업" },
        status: company.assignmentStatuses && company.assignmentStatuses[grantId],
        source: company.assignmentSources && company.assignmentSources[grantId],
        result: company.assignmentResults && company.assignmentResults[grantId],
        schedules: rowSchedules,
        assigned: true
      });
    });
  });
  assignmentRows.sort((a, b) => {
    const orderA = companyOrder.get(String(a.company.id)) ?? 99999;
    const orderB = companyOrder.get(String(b.company.id)) ?? 99999;
    if (orderA !== orderB) return orderA - orderB;
    return String(a.grant && a.grant.deadline || "9999").localeCompare(String(b.grant && b.grant.deadline || "9999"));
  });
  const q = query.trim().toLowerCase();
  const includesQuery = (...values) => !q || values.filter(Boolean).join(" ").toLowerCase().includes(q);
  const visibleAssignments = assignmentRows.filter((row) => {
    if (scope === "assigned" && !row.assigned) return false;
    if (scope === "unassigned" && row.assigned) return false;
    const state = statusLabel(row.result || row.status);
    if (statusFilter !== "all" && state !== statusFilter) return false;
    return includesQuery(row.company.name, row.company.region, row.company.memo, row.grant && row.grant.title, row.grant && row.grant.category, row.grant && row.grant.region);
  });
  const visibleGrants = grants.filter((grant) => includesQuery(grant.title, grant.category, grant.region, grant.condition, grant.memo, grant.deadline));
  const visibleSchedules = [...schedules].filter((item) => {
    const company = companyById.get(String(item.companyId));
    const grant = grantById.get(String(item.grantId));
    return includesQuery(item.date, company && company.name, grant && grant.title);
  }).sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  const visibleLogs = [...logs].filter((item) => includesQuery(item.action, item.detail, item.time)).sort((a, b) => String(b.time || "").localeCompare(String(a.time || "")));
  const syncedAt = board.syncedAt ? new Date(board.syncedAt).toLocaleString("ko-KR", { hour12: false }) : "동기화 시각 없음";
  const tabItems = [
    ["assignments", "고객·배정", assignmentRows.length],
    ["grants", "지원사업 전체", grants.length],
    ["schedules", "일정", schedules.length],
    ["logs", "변경 기록", logs.length]
  ];
  const InfoCell = ({ label, children, wide }) => <div className={wide ? "sm:col-span-2" : ""}><p className="text-[10px] font-bold text-slate-400">{label}</p><div className="mt-1 whitespace-pre-wrap break-words text-xs font-semibold leading-5 text-slate-700">{children || "미입력"}</div></div>;
  return (
    <div className="relative space-y-3">
      {loading && <div className="absolute inset-0 z-20 flex items-start justify-center rounded-md bg-white/75 pt-24 backdrop-blur-[1px]"><span className="inline-flex items-center gap-2 rounded-md border border-slate-200 bg-white px-3 py-2 text-xs font-extrabold text-slate-600 shadow-sm"><RefreshCw size={13} className="animate-spin text-indigo-500" />Supabase 최신 데이터를 불러오는 중</span></div>}
      <div className="grid grid-cols-2 gap-2 lg:grid-cols-5">
        {[
          ["고객사", companies.length, "등록 고객 전체"],
          ["지원사업", grants.length, "공고 전체"],
          ["배정", assignmentRows.filter((row) => row.assigned).length, "고객-사업 연결"],
          ["일정", schedules.length, "등록 일정"],
          ["변경 기록", logs.length, "원본 작업 이력"]
        ].map(([label, value, hint]) => <Card key={label} cls="rounded-md px-3 py-2.5"><p className="text-[10px] font-bold text-slate-400">{label}</p><div className="mt-1 flex items-baseline gap-1.5"><strong className="text-xl font-black text-slate-900">{value}</strong><span className="text-[10px] text-slate-400">{hint}</span></div></Card>)}
      </div>
      <Card cls="rounded-md overflow-hidden">
        <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 px-3 py-2.5">
          <div className="inline-flex rounded-md bg-slate-100 p-0.5">
            {tabItems.map(([value, label, count]) => <button key={value} type="button" onClick={() => setTab(value)} className={"h-7 rounded px-3 text-[11px] font-extrabold " + (tab === value ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-800")}>{label} <span className="ml-1 text-[10px] text-slate-400">{count}</span></button>)}
          </div>
          <div className="relative ml-auto w-full sm:w-72"><Search size={13} className="pointer-events-none absolute left-2.5 top-2.5 text-slate-400" /><Inp className="h-8 rounded-md pl-8 text-xs" value={query} onChange={(event) => setQuery(event.target.value)} placeholder="고객사·지원사업·지역 검색" /></div>
        </div>
        {tab === "assignments" && <>
          <div className="flex flex-wrap items-center gap-2 border-b border-slate-100 bg-slate-50 px-3 py-2">
            <span className="text-[10px] font-bold text-slate-400">범위</span>
            {[['all','전체'],['assigned','배정'],['unassigned','미배정']].map(([value, label]) => <button key={value} type="button" onClick={() => setScope(value)} className={"h-6 rounded-md border px-2 text-[10px] font-bold " + (scope === value ? "border-slate-800 bg-slate-800 text-white" : "border-slate-200 bg-white text-slate-500")}>{label}</button>)}
            <span className="ml-2 text-[10px] font-bold text-slate-400">상태</span>
            <Sel value={statusFilter} onChange={(event) => setStatusFilter(event.target.value)} options={[{ value: "all", label: "전체 상태" }, "미입력", "준비", "대기", "진행", "합격", "완료", "탈락"]} className="h-7 rounded-md text-[10px]" />
            <span className="ml-auto text-[10px] text-slate-400">{syncedAt}</span>
          </div>
          <div className="overflow-x-auto"><div className="min-w-[1040px]">
            <div className="grid grid-cols-[minmax(160px,1.1fr)_minmax(230px,1.7fr)_90px_120px_120px_120px] gap-3 border-b border-slate-200 bg-slate-50 px-4 py-2 text-[10px] font-bold text-slate-400"><span>고객사</span><span>배정 지원사업</span><span>상태</span><span>지역 · 마감</span><span>일정</span><span>월 목표 · 완료</span></div>
            <div className="divide-y divide-slate-100">{visibleAssignments.map((row) => {
              const state = statusLabel(row.result || row.status);
              return <button key={row.id} type="button" onClick={() => setSelected({ type: "assignment", ...row })} className="grid w-full grid-cols-[minmax(160px,1.1fr)_minmax(230px,1.7fr)_90px_120px_120px_120px] items-center gap-3 px-4 py-2.5 text-left hover:bg-indigo-50/50">
                <span className="min-w-0"><b className="block truncate text-xs text-slate-800">{row.company.name || "이름 없음"}</b><small className="mt-0.5 block truncate text-[10px] text-slate-400">{row.company.contractEnded ? "계약 종료" : row.company.round ? row.company.round + "회차" : row.company.region || "기본 정보 미입력"}</small></span>
                <span className="min-w-0"><b className={"block truncate text-xs " + (row.assigned ? "text-indigo-700" : "text-slate-400")}>{row.grant ? row.grant.title : "배정된 지원사업 없음"}</b><small className="mt-0.5 block truncate text-[10px] text-slate-400">{row.source ? "배정 경로 · " + (row.source === "manager" ? "담당자" : row.source) : row.grant && row.grant.category || "-"}</small></span>
                <span><span className={"inline-flex rounded-md border px-2 py-1 text-[10px] font-bold " + statusTone(row.result || row.status)}>{state}</span></span>
                <span className="text-[10px] font-semibold leading-4 text-slate-500">{row.grant && row.grant.region || row.company.region || "-"}<br />{row.grant ? dateText(row.grant.deadline) : "-"}</span>
                <span className="text-[10px] font-semibold text-slate-600">{row.schedules.length ? row.schedules.map((item) => dateText(item.date)).join(", ") : "등록 없음"}</span>
                <span className="text-xs font-black text-slate-700">{Number(row.company.monthlyTarget) || 0} <span className="text-slate-300">/</span> <b className="text-indigo-600">{Number(row.company.monthlyDone) || 0}</b></span>
              </button>;
            })}{!visibleAssignments.length && <Empty text="조건에 맞는 고객·배정 데이터가 없습니다." compact />}</div>
          </div></div>

        {tab === "grants" && <div className="overflow-x-auto"><div className="min-w-[940px]">

    return [...new Set(items)];
  };

  const hasKnownContractAmount = (lead) => contractValue(lead) > 0;
  const customers = db.leads.filter((lead) => lead.status === "계약 완료" && (hasKnownContractAmount(lead) || !!lead.vendorImportSource));
  useEffect(() => {
    if (projectSyncStarted.current || !window.crmFetchProjectNames) return;
    const clientNos = customers.map((lead) => Number((lead.crmSheet && lead.crmSheet.clientNo) || (String(lead.id || '').startsWith('crm-') ? String(lead.id).slice(4) : 0))).filter(Boolean);
    if (!clientNos.length) return;
    projectSyncStarted.current = true;
    window.crmFetchProjectNames(clientNos).then((result) => {
      if (!result || !result.projectsByClient) return;

      up((next) => {
        (next.leads || []).forEach((lead) => {
          const clientNo = Number((lead.crmSheet && lead.crmSheet.clientNo) || (String(lead.id || '').startsWith('crm-') ? String(lead.id).slice(4) : 0));
          const projects = result.projectsByClient[String(clientNo)];
          if (!projects) return;
          lead.crmProjects = projects;
          lead.crmProjectsUpdatedAt = syncedAt;
        });
      });
    }).catch(() => {});
  }, [customers.length]);
  const unpaidPaymentsOf = (lead) => payRows(lead).filter((pay) => !isPayDone(pay) && (Number(pay.amount) || 0) > 0);
  const balanceOf = (lead) => Math.max(0, contractValue(lead) - actualPaid(lead));
  const ledgerStageOf = (lead) => lead.balanceLedgerState === "archived" ? "archived" : balanceOf(lead) <= 0 ? "completed" : "active";
  const LEDGER_STAGES = [
    { id: "active", label: "진행 중", desc: "회수할 중도금·잔금", tone: "border-indigo-200 bg-indigo-50 text-indigo-700" },

    { id: "archived", label: "보관", desc: "오등록·예외 처리", tone: "border-slate-300 bg-slate-100 text-slate-600" },
  ];
  const ledgerStageStats = Object.fromEntries(LEDGER_STAGES.map((stage) => {
    const list = customers.filter((lead) => ledgerStageOf(lead) === stage.id);
    const amount = list.reduce((sum, lead) => sum + (stage.id === "completed" ? actualPaid(lead) : balanceOf(lead)), 0);
    return [stage.id, { count: list.length, amount }];
  }));
  const scopedCustomers = customers.filter((lead) => ledgerStageOf(lead) === ledgerStage);
  const contractSearchText = (lead) => [
    ...(lead.crmProjects || []).flatMap((project) => [project.name, project.service]),
    lead.vendorProjects, ...contractProductsOf(lead), ...(lead.buildups || []), lead.projects,
    ...(lead.lineItems || []).flatMap((item) => [item.name, item.buildup, item.product])
  ].filter(Boolean).join(" ");
  const paymentRiskOf = (lead) => {
    const unpaid = unpaidPaymentsOf(lead);
    const today = todayISO();
    const overdueDays = unpaid.reduce((max, pay) => {
      if (!pay.dueAt || pay.dueAt >= today) return max;
      return Math.max(max, Math.floor((new Date(today) - new Date(pay.dueAt)) / 86400000));
